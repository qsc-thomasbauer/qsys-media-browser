<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The real Content-Security-Policy is applied as a response header in
      src/main/index.ts so that it also covers the dev server. This meta tag is
      a backstop for the packaged file:// case.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src qsys-media: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Media Browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
