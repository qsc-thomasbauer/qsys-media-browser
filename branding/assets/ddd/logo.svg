<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 28" width="168" height="28" role="img" aria-label="Doodoo Dynamics">
  <!--
    Header wordmark. 168x28 matches the other customers so the header layout is
    unchanged.

    The swirl is the same stack of ellipses as icon.png, drawn here as plain
    overlapping shapes rather than a blended union: at 28px tall the crisper
    waists actually read better than a soft blend, which would mush together.
  -->
  <g fill="#552E0D">
    <ellipse cx="12.4" cy="21.6" rx="9.6" ry="3.6" />
    <ellipse cx="13.2" cy="17.0" rx="7.2" ry="3.2" />
    <ellipse cx="14.2" cy="13.0" rx="5.0" ry="2.8" />
    <ellipse cx="15.2" cy="9.6" rx="2.9" ry="2.2" />
    <ellipse cx="16.0" cy="7.2" rx="1.2" ry="1.3" />
  </g>

  <text
    x="32"
    y="13.5"
    font-family="Segoe UI, Inter, system-ui, sans-serif"
    font-size="12.5"
    font-weight="700"
    fill="currentColor"
  >Doodoo</text>
  <text
    x="32"
    y="24.5"
    font-family="Segoe UI, Inter, system-ui, sans-serif"
    font-size="9"
    font-weight="500"
    fill="#552E0D"
    letter-spacing="1.9"
  >DYNAMICS</text>
</svg>
